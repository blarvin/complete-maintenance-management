[build]
  command = "npm run build"
  publish = "dist"

# Client-only SPA: every path must serve the shell. The FSM keeps no state in
# the URL, so nothing deep-links today — this is here so a reload on any path
# can't 404 once something does.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# The SW is the update mechanism, so it must never be served stale — a cached
# service-worker.js means a new build's CACHE_VERSION bump never runs and the
# old app shell keeps being served from the previous cache.
[[headers]]
  for = "/service-worker.js"
  [headers.values]
    Cache-Control = "no-cache"

# index.html is fetched network-first by the SW; keep the CDN from pinning it.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
